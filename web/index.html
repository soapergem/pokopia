<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Pokopia Pokédex — Habitats &amp; Catch Checklist</title>
    <meta
      name="description"
      content="Browse all 357 Pokémon in Pokémon Pokopia, see which habitats each one appears in, and keep a checklist of the ones you have caught."
    />
    <link rel="canonical" href="https://pokopia.gemovationlabs.com/" />

    <link rel="icon" type="image/svg+xml" href="/pokeball.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1420" media="(prefers-color-scheme: dark)" />

    <!-- Social previews. These must be absolute URLs: scrapers do not resolve
         relative paths, and they do not run the JavaScript that builds the page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pokopia Pokédex" />
    <meta property="og:title" content="Pokopia Pokédex" />
    <meta
      property="og:description"
      content="Browse all 357 Pokémon in Pokémon Pokopia, see which habitats each one appears in, and keep a checklist of the ones you have caught."
    />
    <meta property="og:url" content="https://pokopia.gemovationlabs.com/" />
    <meta property="og:image" content="https://pokopia.gemovationlabs.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A Poké Ball on a pale grey background" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pokopia Pokédex" />
    <meta
      name="twitter:description"
      content="Browse all 357 Pokémon in Pokémon Pokopia, see which habitats each one appears in, and keep a checklist of the ones you have caught."
    />
    <meta name="twitter:image" content="https://pokopia.gemovationlabs.com/og-image.png" />
    <meta name="twitter:image:alt" content="A Poké Ball on a pale grey background" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pokopia Pokédex",
        "url": "https://pokopia.gemovationlabs.com/",
        "description": "Browse all 357 Pokémon in Pokémon Pokopia, see which habitats each one appears in, and keep a checklist of the ones you have caught.",
        "applicationCategory": "ReferenceApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true
      }
    </script>

    <script>
      // Apply the stored theme before first paint so the page never flashes the wrong one.
      try {
        var stored = localStorage.getItem("pokopia:theme:v1");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      This Pokédex needs JavaScript to filter and track Pokémon. Please enable it
      and reload the page.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
